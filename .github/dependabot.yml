---
version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    groups:
      minor-and-patch-action-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: .devcontainer
    schedule:
      interval: monthly
