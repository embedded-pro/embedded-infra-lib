syntax = "proto3";

import "EchoAttributes.proto";

package gap.peripheral;
option java_package = "com.philips.emil.protobufEcho";
option java_outer_classname = "GapPeripheralProto";

message Address
{
    bytes address = 1 [(bytes_size) = 6];
}

// Link layer states of a device in a Peripheral role
// Peripheral role states are standby, advertising and connected.
// Allowed transitions are as follows.
// 1. Every state can go to standby.
// 2. Every state can be entered from standby except the connected state.
// 3. Connected state can only be entered from advertising.
// For further details refer to Section 1.1, BLUETOOTH CORE SPECIFICATION Version 5.3 | Vol 6, Part B
message State
{
    enum Event
    {
        reserved 1, 4;

        standby = 0;
        connected = 2;
        advertising = 3;
    }
    Event value = 1;
}

message IoCapabilities
{
    // Values taken from Bluetooth Core Specification
    // Volume 3, Part H, section 3.3.1, Table 3.4 (IO Capability)
    enum IoCapabilitiesEnum
    {
        display = 0;
        displayYesNo = 1;
        keyboard = 2;
        none = 3;
        keyboardDisplay = 4;
    }

    IoCapabilitiesEnum ioCaps = 1;
}

message AdvertisementType
{
    enum AdvertisementTypeEnum
    {
        advInd = 0;
        advNonconnInd = 1;
    }

    AdvertisementTypeEnum type = 1;
}

message SecurityModeAndLevel
{
    // Ordered to match services::GapPairing::SecurityModeAndLevel. The six combinations the
    // specification defines and no others; mode 2 has levels 1 and 2 only.
    // Bluetooth Core Specification, Volume 3, Part C, sections 10.2.1 and 10.2.2
    enum ModeAndLevel
    {
        mode1Level1 = 0;
        mode1Level2 = 1;
        mode1Level3 = 2;
        mode1Level4 = 3;
        mode2Level1 = 4;
        mode2Level2 = 5;
    }

    ModeAndLevel value = 1;
}

message AddressType
{
    enum AddressTypeEnum
    {
        publicAddress = 0;
        randomAddress = 1;
    }

    AddressTypeEnum type = 1;
}

message DeviceAddress
{
    Address address = 1;
    AddressType addressType = 2;
}

message AdvertisementMode
{
    AdvertisementType type = 1;
    uint32 advInterval = 2;
}

message AdvertisementData
{
    bytes data = 1 [(bytes_size) = 31]; //Don't add flags data, method adds flags data internally with the flag bits 'LE General Discoverable Mode' and 'BR/EDR Not Supported' enabled.
}

message ConnectionParameterUpdate
{
    uint32 minConnectionInterval = 1; // Interval = value * 1.25 ms, range 0x0006 to 0x0C80
    uint32 maxConnectionInterval = 2; // Interval = value * 1.25 ms, range 0x0006 to 0x0C80
    uint32 peripheralLatency = 3;
    uint32 supervisionTimeout = 4;    // Timeout = value * 10 ms, range 0x000A to 0x0C80
}

message Passkey
{
    // Six digits, 000000 to 999999. The numericComparison discriminator is gone: numeric
    // comparison is its own method now.
    uint32 passkey = 1;
}

message PairingStatus
{
    // Ordered to match services::GapPairingResult. success is 0, as in every other
    // result enum in this module.
    enum Result
    {
        success = 0;
        passkeyEntryFailed = 1;
        authenticationRequirementsNotMet = 2;
        pairingNotSupported = 3;
        insufficientEncryptionKeySize = 4;
        numericComparisonFailed = 5;
        timeout = 6;
        encryptionFailed = 7;
        unknown = 8;
        oobNotAvailable = 9;
        confirmValueFailed = 10;
        commandNotSupported = 11;
        repeatedAttempts = 12;
        invalidParameters = 13;
        dhKeyCheckFailed = 14;
        brEdrPairingInProgress = 15;
        crossTransportKeyDerivationNotAllowed = 16;
        keyRejected = 17;
    }

    Result result = 1;
}

message OutOfBandData
{
    Address address = 1;
    AddressType addressType = 2;
    bytes randomData = 3 [(bytes_size) = 16];
    bytes confirmData = 4 [(bytes_size) = 16];
}

message BoolValue
{
    bool value = 1;
}

message UInt32Value
{
    uint32 value = 1;
}

message RequestStatus
{
    enum Status
    {
        accepted = 0;
        invalidState = 1;
        invalidParameter = 2;
        busy = 3;
        notSupported = 4;
    }

    Status status = 1;
}

message Completion
{
    enum Result
    {
        success = 0;
        invalidParameter = 1;
        controllerError = 2;
    }

    RequestStatus requestStatus = 1;
    Result result = 2;
}

message PairingCompletion
{
    RequestStatus requestStatus = 1;
    PairingStatus result = 2;
}

message BondCompletion
{
    RequestStatus requestStatus = 1;
}

service GapPeripheral
{
    option (service_id) = 32;

    // Allowed states: standby
    rpc Advertise(AdvertisementMode) returns (Nothing) { option (method_id) = 1; }

    // Allowed states: advertising, connected
    rpc Standby(Nothing) returns (Nothing) { option (method_id) = 2; }

    rpc SetAdvertisementData(AdvertisementData) returns (Nothing) { option (method_id) = 3; }
    rpc SetScanResponseData(AdvertisementData) returns (Nothing) { option (method_id) = 4; }
    rpc SetAllowPairing(BoolValue) returns (Nothing) { option (method_id) = 5; }
    // Method id 6 carried a separate mode and level and is left unused, so that a peer speaking
    // that version fails on an unknown method rather than misreading a single combined value.
    rpc SetSecurityMode(SecurityModeAndLevel) returns (Nothing) { option (method_id) = 19; }
    rpc SetSecureConnectionsOnly(BoolValue) returns (Nothing) { option (method_id) = 20; }
    rpc SetIoCapabilities(IoCapabilities) returns (Nothing) { option (method_id) = 7; }
    rpc RemoveAllBonds(Nothing) returns (Nothing) { option (method_id) = 8; }

    // Allowed states: advertising
    rpc GetResolvableAddress(Nothing) returns (Nothing) { option (method_id) = 9; }
    rpc GetIdentityAddress(Nothing) returns (Nothing) { option (method_id) = 10; }

    rpc GenerateOutOfBandData(Nothing) returns (Nothing) { option (method_id) = 11; }
    rpc SetOutOfBandData(OutOfBandData) returns (Nothing) { option (method_id) = 12; }

    rpc SetConnectionParameters(ConnectionParameterUpdate) returns (Nothing) { option (method_id) = 13; }

    rpc PairAndBond(Nothing) returns (Nothing) { option (method_id) = 14; }

    rpc AuthenticateWithPasskey(UInt32Value) returns (Nothing) { option (method_id) = 15; }
    rpc NumericComparisonConfirm(BoolValue) returns (Nothing) { option (method_id) = 16; }
    rpc RemoveOldestBond(Nothing) returns (Nothing) { option (method_id) = 17; }

    rpc IsDeviceBonded(DeviceAddress) returns (Nothing) { option (method_id) = 18; }
}

service GapPeripheralResponse
{
    option (service_id) = 34;

    rpc DeviceStarted(Nothing) returns (Nothing) { option (method_id) = 2; }
    rpc StateChanged(State) returns (Nothing) { option (method_id) = 3; }
    rpc ResolvableAddress(Address) returns (Nothing) { option (method_id) = 4; }
    // Method id 5 carried a passkey with a numericComparison flag and is left unused, so that a
    // peer speaking that version fails on an unknown method rather than reading a passkey as a
    // comparison value.
    rpc DisplayPasskey(Passkey) returns (Nothing) { option (method_id) = 27; }
    rpc ConfirmNumericComparison(UInt32Value) returns (Nothing) { option (method_id) = 28; }
    rpc IdentityAddress(Address) returns (Nothing) { option (method_id) = 6; }
    rpc OutOfBandDataGenerated(OutOfBandData) returns (Nothing) { option (method_id) = 7; }

    rpc AdvertiseComplete(Completion) returns (Nothing) { option (method_id) = 8; }
    rpc StandbyComplete(Completion) returns (Nothing) { option (method_id) = 9; }
    rpc SetAdvertisementDataComplete(Completion) returns (Nothing) { option (method_id) = 10; }
    rpc SetScanResponseDataComplete(Completion) returns (Nothing) { option (method_id) = 11; }
    rpc SetAllowPairingComplete(PairingCompletion) returns (Nothing) { option (method_id) = 12; }
    rpc SetSecurityModeComplete(PairingCompletion) returns (Nothing) { option (method_id) = 13; }
    rpc SetIoCapabilitiesComplete(PairingCompletion) returns (Nothing) { option (method_id) = 14; }
    rpc RemoveAllBondsComplete(BondCompletion) returns (Nothing) { option (method_id) = 15; }
    rpc SetOutOfBandDataComplete(PairingCompletion) returns (Nothing) { option (method_id) = 16; }
    rpc SetConnectionParametersComplete(Completion) returns (Nothing) { option (method_id) = 17; }
    rpc PairAndBondComplete(PairingCompletion) returns (Nothing) { option (method_id) = 18; }
    rpc AuthenticateWithPasskeyComplete(PairingCompletion) returns (Nothing) { option (method_id) = 19; }
    rpc NumericComparisonConfirmComplete(PairingCompletion) returns (Nothing) { option (method_id) = 20; }
    rpc RemoveOldestBondComplete(BondCompletion) returns (Nothing) { option (method_id) = 21; }
    rpc DeviceBonded(BoolValue) returns (Nothing) { option (method_id) = 22; }

    rpc PairingSuccessfullyCompleted(Nothing) returns (Nothing) { option (method_id) = 23; }
    rpc PairingFailed(PairingStatus) returns (Nothing) { option (method_id) = 24; }
    rpc NumberOfBondsChanged(UInt32Value) returns (Nothing) { option (method_id) = 25; }
    rpc SetSecureConnectionsOnlyComplete(PairingCompletion) returns (Nothing) { option (method_id) = 26; }
}
