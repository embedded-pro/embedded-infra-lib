// BLE Direct Test Mode - according to BLE Core Specification 5.3 (Vol. 6, Part F)
// Includes features to generate carrier waves (tones) or transmit and receive
// BLE reference packets.

syntax = "proto3";

import "EchoAttributes.proto";

package dtm;
option java_package = "com.philips.emil.protobufEcho";
option java_outer_classname = "DtmProto";

// ToneParams: Input parameters to generate a carrier wave (tone)
//   - rfChannel    : BLE channel ID (2.402 + 0.002*<rfChannel>) Ghz (Range 0x00 to 0x27)
//   - offset       : Frequency offset for tone channel (Range: 0x00 - 0xff)
message ToneParams
{
    uint32 rfChannel = 1;
    uint32 offset = 2;
}

// TxPowerParams: Input parameter to set the transmit power
//   - txPower      : Transmit power in dBm, as LE Transmitter Test v4 carries it
// Bluetooth Core Specification, Volume 4, Part E, section 7.8.29
message TxPowerParams
{
    int32 txPower = 1;
}

// The PHY a test packet is sent or received on. A test distinguishes the two LE Coded coding
// schemes, where a connection only selects a PHY.
// Bluetooth Core Specification, Volume 4, Part E, sections 7.8.28 and 7.8.29
message Phy
{
    enum PhyEnum
    {
        unspecified = 0;
        le1M = 1;
        le2M = 2;
        leCodedS8 = 3;
        leCodedS2 = 4;
    }

    PhyEnum phy = 1;
}

// Bluetooth Core Specification, Volume 6, Part F, section 4.1.4
message PacketPayload
{
    enum PacketPayloadEnum
    {
        pseudoRandom9 = 0;
        alternating11110000 = 1;
        alternating10101010 = 2;
        pseudoRandom15 = 3;
        allOnes = 4;
        allZeroes = 5;
        alternating00001111 = 6;
        alternating0101 = 7;
    }

    PacketPayloadEnum payload = 1;
}

// RxParams: Input parameters for the receive test
//   - channel      : Channel N, where the centre frequency is 2402 + 2 * N MHz (range 0x00 - 0x27)
//   - durationMs   : Duration in milliseconds
// Bluetooth Core Specification, Volume 6, Part F, section 4.1.1
message RxParams
{
    uint32 channel = 1;
    Phy phy = 2;
    uint32 durationMs = 3;
}

// TxParams: Input parameters for the transmit test
//   - channel      : Channel N, where the centre frequency is 2402 + 2 * N MHz (range 0x00 - 0x27)
//   - dataLength   : Length in octets of the payload data in each packet
//   - durationMs   : Duration in milliseconds
message TxParams
{
    uint32 channel = 1;
    uint32 dataLength = 2;
    PacketPayload packetPayload = 3;
    Phy phy = 4;
    uint32 durationMs = 5;
}

service Dtm
{
    option (service_id) = 232;

    rpc StartUnmodulatedCarrier(ToneParams) returns(Nothing) { option (method_id) = 1; }
    rpc StopUnmodulatedCarrier(Nothing) returns(Nothing) { option (method_id) = 2; }
    // Method id 3 carried a vendor power index rather than dBm, so a peer speaking that version
    // would read a level it could not interpret. It is left unused.
    rpc SetTxPowerLevel(TxPowerParams) returns(Nothing) { option (method_id) = 7; }
    rpc StartReceiverTest(RxParams) returns(Nothing) { option (method_id) = 4; }
    rpc StartTransmitterTest(TxParams) returns(Nothing) { option (method_id) = 5; }
    rpc EndTest(Nothing) returns(Nothing) { option (method_id) = 6; }
}

message Result
{
    bool result = 1;
}

message TestResult
{
    bool result = 1;
    uint32 nrPacketsReceived = 2;
}

service DtmResponse
{
    option (service_id) = 233;

    rpc Done(Result) returns (Nothing) { option (method_id) = 1; }
    rpc TestCompleted(TestResult) returns (Nothing) { option (method_id) = 2; }
}
