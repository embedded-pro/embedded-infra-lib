syntax = "proto3";

import "EchoAttributes.proto";

package gap.central;
option java_package = "com.philips.emil.protobufEcho";
option java_outer_classname = "GapCentralProto";

message Address
{
    bytes address = 1 [(bytes_size) = 6];
}

// Link layer states of a device in a Central role
// Central role states are standby, scanning, initiating and connected.
// Allowed transitions are as follows.
// 1. Every state can go to standby.
// 2. Every state can be entered from standby except the connected state.
// 3. Connected state can only be entered from initiating.
// For further details refer to Section 1.1, BLUETOOTH CORE SPECIFICATION Version 5.3 | Vol 6, Part B
message State
{
    enum Event
    {
        reserved 3;

        standby = 0;
        scanning = 1;
        connected = 2;
        initiating = 4;
    }
    Event value = 1;
}

message IoCapabilities
{
    // Values taken from Bluetooth Core Specification
    // Volume 3, Part H, section 3.3.1, Table 3.4 (IO Capability)
    enum IoCapabilitiesEnum
    {
        display = 0;
        displayYesNo = 1;
        keyboard = 2;
        none = 3;
        keyboardDisplay = 4;
    }

    IoCapabilitiesEnum ioCaps = 1;
}

message ScanParameters
{
    // Ordered to match services::GapScanType.
    enum ScanType
    {
        passive = 0;
        active = 1;
    }

    uint32 interval = 1; // Interval = value * 0.625 ms
    uint32 window = 2;   // Window   = value * 0.625 ms
    ScanType type = 3;
}

message SecurityModeAndLevel
{
    // Ordered to match services::GapPairing::SecurityModeAndLevel. The six combinations the
    // specification defines and no others; mode 2 has levels 1 and 2 only.
    // Bluetooth Core Specification, Volume 3, Part C, sections 10.2.1 and 10.2.2
    enum ModeAndLevel
    {
        mode1Level1 = 0;
        mode1Level2 = 1;
        mode1Level3 = 2;
        mode1Level4 = 3;
        mode2Level1 = 4;
        mode2Level2 = 5;
    }

    ModeAndLevel value = 1;
}

message AddressType
{
    enum AddressTypeEnum
    {
        publicAddress = 0;
        randomAddress = 1;
    }

    AddressTypeEnum type = 1;
}

message DeviceAddress
{
    Address address = 1;
    AddressType addressType = 2;
}

message AdvertisingEventType
{
    enum AdvertisingEventTypeEnum
    {
        advInd = 0;
        advDirectInd = 1;
        advScanInd = 2;
        advNonconnInd = 3;
        scanResponse = 4;
    }

    AdvertisingEventTypeEnum type = 1;
}

message ConnectionParameters
{
    Address address = 1;
    AddressType addressType = 2;
    uint32 initiatingTimeoutInMs = 3;
}

message PairingStatus
{
    // Ordered to match services::GapPairingResult. success is 0, as in every other
    // result enum in this module.
    enum Result
    {
        success = 0;
        passkeyEntryFailed = 1;
        authenticationRequirementsNotMet = 2;
        pairingNotSupported = 3;
        insufficientEncryptionKeySize = 4;
        numericComparisonFailed = 5;
        timeout = 6;
        encryptionFailed = 7;
        unknown = 8;
        oobNotAvailable = 9;
        confirmValueFailed = 10;
        commandNotSupported = 11;
        repeatedAttempts = 12;
        invalidParameters = 13;
        dhKeyCheckFailed = 14;
        brEdrPairingInProgress = 15;
        crossTransportKeyDerivationNotAllowed = 16;
        keyRejected = 17;
    }

    Result result = 1;
}

message OutOfBandData
{
    Address address = 1;
    AddressType addressType = 2;
    bytes randomData = 3 [(bytes_size) = 16];
    bytes confirmData = 4 [(bytes_size) = 16];
}

message DiscoveredDevice
{
    reserved 5;

    Address address = 1;
    AddressType addressType = 2;
    bytes data = 3 [(bytes_size) = 31];
    int32 rssi = 4;
    AdvertisingEventType eventType = 6;
}

message DeviceDiscoveryFilter
{
    enum Filter
    {
        address = 0;
        advertisingData = 1; // Filtering on contents of Manufacturer specific data

    }

    Filter filter = 1;
    bytes data = 2 [(bytes_size) = 32];
}

message BoolValue
{
    bool value = 1;
}

message UInt32Value
{
    uint32 value = 1;
}

message RequestStatus
{
    enum Status
    {
        accepted = 0;
        invalidState = 1;
        invalidParameter = 2;
        busy = 3;
        notSupported = 4;
    }

    Status status = 1;
}

message Completion
{
    enum Result
    {
        success = 0;
        cancelled = 1;
        timeout = 2;
        connectionFailed = 3;
        controllerError = 4;
    }

    RequestStatus requestStatus = 1;
    Result result = 2;
}

message PairingCompletion
{
    RequestStatus requestStatus = 1;
    PairingStatus result = 2;
}

message BondCompletion
{
    RequestStatus requestStatus = 1;
}

service GapCentral
{
    option (service_id) = 33;

    // Allowed states: standby
    // Method id 1 took no parameters and is left unused, so that a peer speaking that version
    // fails on an unknown method rather than scanning with whatever the port happens to default to.
    rpc StartDeviceDiscovery(ScanParameters) returns (Nothing) { option (method_id) = 21; }

    // Allowed states: scanning
    rpc StopDeviceDiscovery(Nothing) returns (Nothing) { option (method_id) = 2; }

    // Allowed states: standby
    // For successful connection establishment, state will follow: standby -> initiating -> connected
    // For failed connection establishment, state will follow: standby -> initiating -> standby
    rpc Connect(ConnectionParameters) returns (Nothing) { option (method_id) = 3; }

    // Allowed states: initiating
    rpc CancelConnect(Nothing) returns (Nothing) { option (method_id) = 4; }

    // Allowed states: connected
    rpc Disconnect(Nothing) returns (Nothing) { option (method_id) = 5; }

    // Allowed states: connected
    // 1. If there is a pre-existing bond, then the connection will be encrypted.
    // 2. If there is no pre-existing bond, then pairing, encrypting, and bonding (storing the keys) will take place.
    rpc PairAndBond(Nothing) returns (Nothing) { option (method_id) = 6; }

    // Method id 7 carried a separate mode and level and is left unused, so that a peer speaking
    // that version fails on an unknown method rather than misreading a single combined value.
    rpc SetSecurityMode(SecurityModeAndLevel) returns (Nothing) { option (method_id) = 19; }
    rpc SetSecureConnectionsOnly(BoolValue) returns (Nothing) { option (method_id) = 20; }
    rpc SetIoCapabilities(IoCapabilities) returns (Nothing) { option (method_id) = 8; }
    rpc AuthenticateWithPasskey(UInt32Value) returns (Nothing) { option (method_id) = 9; }
    rpc NumericComparisonConfirm(BoolValue) returns (Nothing) { option (method_id) = 10; }
    rpc RemoveAllBonds(Nothing) returns (Nothing) { option (method_id) = 11; }
    rpc SetDeviceDiscoveryFilter(DeviceDiscoveryFilter) returns (Nothing) { option (method_id) = 12; }

    // This will only succeed if Address is a private resolvable address, and if the device is bonded
    rpc ResolvePrivateAddress(Address) returns (Nothing) { option (method_id) = 13; }

    rpc GenerateOutOfBandData(Nothing) returns (Nothing) { option (method_id) = 15; }
    rpc SetOutOfBandData(OutOfBandData) returns (Nothing) { option (method_id) = 16; }

    // This will work with both public and random addresses
    rpc IsDeviceBonded(DeviceAddress) returns (Nothing) { option (method_id) = 17; }
    rpc RemoveOldestBond(Nothing) returns (Nothing) { option (method_id) = 18; }
}

service GapCentralResponse
{
    option (service_id) = 35;

    rpc DeviceDiscovered(DiscoveredDevice) returns (Nothing) { option (method_id) = 2; }
    rpc StateChanged(State) returns (Nothing) { option (method_id) = 3; }

    rpc PairingSuccessfullyCompleted(Nothing) returns (Nothing) { option (method_id) =  4; }
    rpc PairingFailed(PairingStatus) returns (Nothing) { option (method_id) = 5; }

    rpc NumberOfBondsChanged(UInt32Value) returns (Nothing) { option (method_id) = 6; }
    rpc DeviceStarted(Nothing) returns (Nothing) { option (method_id) = 7; }
    rpc ResolvedPrivateAddress(Address) returns (Nothing) { option (method_id) = 8; }
    rpc ResolvePrivateAddressFailed(Nothing) returns (Nothing) { option (method_id) = 9; }
    rpc DeviceBonded(BoolValue) returns (Nothing) { option (method_id) = 10; }
    rpc OutOfBandDataGenerated(OutOfBandData) returns (Nothing) { option (method_id) = 11; }

    rpc StartDeviceDiscoveryComplete(Completion) returns (Nothing) { option (method_id) = 12; }
    rpc StopDeviceDiscoveryComplete(Completion) returns (Nothing) { option (method_id) = 13; }
    rpc ConnectComplete(Completion) returns (Nothing) { option (method_id) = 14; }
    rpc CancelConnectComplete(Completion) returns (Nothing) { option (method_id) = 15; }
    rpc DisconnectComplete(Completion) returns (Nothing) { option (method_id) = 16; }
    rpc PairAndBondComplete(PairingCompletion) returns (Nothing) { option (method_id) = 17; }
    rpc SetSecurityModeComplete(PairingCompletion) returns (Nothing) { option (method_id) = 18; }
    rpc SetIoCapabilitiesComplete(PairingCompletion) returns (Nothing) { option (method_id) = 19; }
    rpc AuthenticateWithPasskeyComplete(PairingCompletion) returns (Nothing) { option (method_id) = 20; }
    rpc NumericComparisonConfirmComplete(PairingCompletion) returns (Nothing) { option (method_id) = 21; }
    rpc RemoveAllBondsComplete(BondCompletion) returns (Nothing) { option (method_id) = 22; }
    rpc SetDeviceDiscoveryFilterComplete(Completion) returns (Nothing) { option (method_id) = 23; }
    rpc RemoveOldestBondComplete(BondCompletion) returns (Nothing) { option (method_id) = 24; }
    rpc SetOutOfBandDataComplete(PairingCompletion) returns (Nothing) { option (method_id) = 25; }
    rpc SetSecureConnectionsOnlyComplete(PairingCompletion) returns (Nothing) { option (method_id) = 26; }
}
